<!DOCTYPE html>
<html lang="en">   
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YeahWick's Blog</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/styles.css">
    <link rel="alternate" type="application/rss+xml" title="YeahWick's Blog RSS Feed" href="/rss.xml">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header card">
            <a href="/" class="logo-text">YeahWick's Blog</a>
            <nav class="nav-links">
                <a href="/"><i class="fas fa-home"></i> Home</a>
                <a href="/blog/"><i class="fas fa-blog"></i> Blog</a>
                <a href="/rss.xml"><i class="fas fa-rss"></i> RSS</a>
                <a href="/"><i class="fas fa-envelope"></i> Contact</a>
                <button id="dark-mode-toggle" class="dark-mode-toggle" aria-label="Toggle dark mode">
                    <i class="fas fa-moon"></i>
                </button>
            </nav>
        </header>

        <!-- Hero Section -->
        <section class="hero card">
            <h1>Welcome to YeahWick's Blog</h1>
            <p>Exploring code, technology, and digital creativity</p>
            <a href="/blog/" class="button"><i class="fas fa-arrow-right"></i> Start Reading</a>
        </section>

        <!-- Blog Posts -->
        <section class="card">
            <div class="section-heading">
                <h2><i class="fas fa-newspaper"></i> Latest Posts</h2>
            </div>

            <div class="content-grid" id="blog-posts-container">
                <!-- Blog posts will be loaded here dynamically -->
            </div>

            <div style="text-align: center; margin-top: 24px;">
                <a href="/blog/" class="button"><i class="fas fa-th-list"></i> View All Posts</a>
            </div>
        </section>

        <!-- Footer -->
        <footer class="footer">
            <div class="logo-text">YeahWick's Blog</div>
            <p>Where technology meets creativity</p>

            <div class="social-icons">
                <a href="#" aria-label="Twitter"><i class="fab fa-twitter"></i></a>
                <a href="#" aria-label="GitHub"><i class="fab fa-github"></i></a>
                <a href="#" aria-label="LinkedIn"><i class="fab fa-linkedin"></i></a>
            </div>

            <p>&copy; 2025 YeahWick's Blog. All rights reserved.</p>
        </footer>
    </div>

    <script src="/scripts/dark-mode.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            loadBlogPosts();
        });

        async function loadBlogPosts() {
            try {
                const response = await fetch('/blog/posts.json');
                if (!response.ok) {
                    throw new Error('Failed to load blog posts');
                }
                const posts = await response.json();

                const container = document.getElementById('blog-posts-container');
                container.innerHTML = '';

                // Display only the first 3 posts on the homepage
                const displayedPosts = posts.slice(0, 3);

                displayedPosts.forEach(post => {
                    const postElement = document.createElement('article');
                    postElement.className = 'card blog-post';

                    postElement.innerHTML = `
                        <div class="post-meta">
                            <span>${post.date}</span>
                        </div>
                        <h3><a href="${post.url}">${post.title}</a></h3>
                        <p class="post-excerpt">${post.excerpt}</p>
                        <a href="${post.url}" class="button read-more"><i class="fas fa-arrow-right"></i> Read More</a>
                    `;

                    container.appendChild(postElement);
                });
            } catch (error) {
                console.error('Error loading blog posts:', error);
                const container = document.getElementById('blog-posts-container');
                container.innerHTML = '<p style="text-align: center;">Failed to load blog posts. Please try again later.</p>';
            }
        }
    </script>
</body>
</html>
