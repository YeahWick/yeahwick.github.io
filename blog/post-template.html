<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{POST_TITLE}} - YeahWick's Blog</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header card">
            <a href="/" class="logo-text">YeahWick's Blog</a>
            <nav class="nav-links">
                <a href="/"><i class="fas fa-home"></i> Home</a>
                <a href="/blog/"><i class="fas fa-blog"></i> Blog</a>
                <a href="/"><i class="fas fa-envelope"></i> Contact</a>
                <button id="dark-mode-toggle" class="dark-mode-toggle" aria-label="Toggle dark mode">
                    <i class="fas fa-moon"></i>
                </button>
            </nav>
        </header>

        <!-- Blog Post -->
        <article class="card">
            <div class="post-header">
                <h1>{{POST_TITLE}}</h1>
                <div class="post-meta">
                    <span>{{PUBLISH_DATE}}</span>
                </div>
            </div>

            <div class="post-content">
                {{POST_CONTENT}}
            </div>

            <div style="text-align: center;">
                <a href="/blog/" class="button back-button"><i class="fas fa-arrow-left"></i> Back to Blog</a>
            </div>
        </article>

        <!-- Footer -->
        <footer class="footer">
            <div class="logo-text">YeahWick's Blog</div>
            <p>Where technology meets creativity</p>

            <div class="social-icons">
                <a href="#" aria-label="Twitter"><i class="fab fa-twitter"></i></a>
                <a href="#" aria-label="GitHub"><i class="fab fa-github"></i></a>
                <a href="#" aria-label="LinkedIn"><i class="fab fa-linkedin"></i></a>
            </div>

            <p>&copy; 2025 YeahWick's Blog. All rights reserved.</p>
        </footer>
    </div>

    <script src="/scripts/dark-mode.js"></script>
</body>
</html>
