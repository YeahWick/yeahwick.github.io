<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Blog Posts - YeahWick's Blog</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/styles.css">
    <link rel="alternate" type="application/rss+xml" title="YeahWick's Blog RSS Feed" href="/rss.xml">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header card">
            <a href="/" class="logo-text">YeahWick's Blog</a>
            <nav class="nav-links">
                <a href="/"><i class="fas fa-home"></i> Home</a>
                <a href="/blog/"><i class="fas fa-blog"></i> Blog</a>
                <a href="/rss.xml"><i class="fas fa-rss"></i> RSS</a>
                <a href="/"><i class="fas fa-envelope"></i> Contact</a>
                <button id="dark-mode-toggle" class="dark-mode-toggle" aria-label="Toggle dark mode">
                    <i class="fas fa-moon"></i>
                </button>
            </nav>
        </header>

        <!-- Page Header -->
        <section class="page-header card">
            <h1>All Blog Posts</h1>
            <p>Discover all articles from YeahWick's Blog</p>
        </section>

        <!-- Blog Posts -->
        <section class="posts-container" id="posts-container">
            <!-- Posts will be loaded dynamically from posts.json -->
        </section>

        <!-- Footer -->
        <footer class="footer">
            <div class="logo-text">YeahWick's Blog</div>
            <p>Where technology meets creativity</p>

            <div class="social-icons">
                <a href="#" aria-label="Twitter"><i class="fab fa-twitter"></i></a>
                <a href="#" aria-label="GitHub"><i class="fab fa-github"></i></a>
                <a href="#" aria-label="LinkedIn"><i class="fab fa-linkedin"></i></a>
            </div>

            <p>&copy; 2025 YeahWick's Blog. All rights reserved.</p>
        </footer>
    </div>

    <script src="/scripts/dark-mode.js"></script>
    <script>
        // Load posts from posts.json
        async function loadPosts() {
            try {
                const response = await fetch('/blog/posts.json');
                const posts = await response.json();
                const container = document.getElementById('posts-container');

                posts.forEach(post => {
                    const article = document.createElement('article');
                    article.className = 'card blog-post';
                    article.innerHTML = `
                        <div class="post-meta">
                            <span>${post.date}</span>
                        </div>
                        <h3><a href="${post.url}">${post.title}</a></h3>
                        <p class="post-excerpt">${post.excerpt}</p>
                        <a href="${post.url}" class="button read-more"><i class="fas fa-arrow-right"></i> Read More</a>
                    `;
                    container.appendChild(article);
                });
            } catch (error) {
                console.error('Error loading posts:', error);
                document.getElementById('posts-container').innerHTML = '<p>Error loading posts. Please try again later.</p>';
            }
        }

        // Load posts when page loads
        document.addEventListener('DOMContentLoaded', loadPosts);
    </script>
</body>
</html>
